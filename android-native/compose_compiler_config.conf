// Stability the Compose compiler cannot infer for itself.
//
// `core/model` is a pure Kotlin JVM module on purpose — the domain types must
// not know about Android — which means it is not compiled with the Compose
// compiler plugin, so none of its classes carry the stability metadata the
// plugin writes. Compose therefore assumes the worst about every one of them,
// and `MediaItem`, `MediaDetail` and friends are the parameters of the two
// most-composed functions in the app (`PosterCard`, `MediaRow`).
//
// They are in fact immutable: `data class`es of `val`s, with correct
// `equals`. Saying so here lets a card skip on structural equality rather
// than on instance identity, which is what strong skipping falls back to —
// the difference that matters whenever a repository re-emits an equal-but-new
// object graph after a background sync.
com.mdblisthub.tv.core.model.*

// `List` is an interface, so the compiler is right that an implementation
// could be mutable. Every list this app puts in composition comes out of a
// `data class` above or a `remember`, and none is ever mutated in place;
// without this line those fields alone would make their holders unstable
// again and undo the entry above.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
