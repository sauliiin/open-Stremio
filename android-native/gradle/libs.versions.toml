[versions]
# Single source of truth for the SDK levels; every module reads these back
# through `libs.versions.*` instead of restating them.
#
# compileSdk is pinned at 36 because that is the platform installed on this
# machine. AndroidX artifacts released after the SDK 37 bump (core 1.18+,
# lifecycle 2.11+) refuse to be compiled against it and demand AGP 9.1, so the
# two below are held one release back. Raising all three together is a single
# coordinated change — see README.
compileSdk = "36"
# Back to 24 now that the player is Media3: the 26 floor existed only because
# the vendored mpv AAR declared it, and Media3 asks for 21.
minSdk = "24"
targetSdk = "36"

agp = "8.13.2"
kotlin = "2.4.10"
ksp = "2.3.11"

coreKtx = "1.17.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
tvMaterial = "1.1.0"
lifecycle = "2.10.0"
navigation = "2.9.8"

room = "2.8.4"
work = "2.11.2"
datastore = "1.2.1"

coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.4.0"
retrofit = "3.0.0"
coil = "3.5.0"

# Media3/ExoPlayer — Google's own player, and the reason the engine moved off
# mpv: its load control is built for exactly this app's workload (third-party
# CDNs and debrid mirrors over home Wi-Fi), where a fixed cache size stalls
# and an adaptive buffer does not.
media3 = "1.11.0"

# Baseline profiles. `benchmark` versions both the Macrobenchmark library the
# generator is written against and the Gradle plugin that wires it up, so the
# two can never drift apart.
benchmark = "1.4.1"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
junit = "4.13.2"
firebaseBom = "34.17.0"
credentials = "1.6.0"
googleId = "1.2.0"
googleServices = "4.5.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }

# Compose for TV: focus handling, D-pad semantics and the 10-foot Material
# surfaces. The phone Material3 artifact is deliberately absent — mixing the
# two is what produces components that swallow D-pad focus.
tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }

lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
# `media3-ui` is what renders subtitles and owns the resize modes; without it
# a bare SurfaceView shows video with no cues at all.
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
# Addons hand back HLS and DASH manifests as readily as plain files, and
# neither plays without its own extractor module.
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
# Puts the player on the same OkHttp stack as the mirror probe, so the TLS
# connection the probe just established is reused instead of re-handshaked.
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
# `StandaloneDatabaseProvider`, which is what lets `SimpleCache` keep its index
# across process restarts rather than rescanning the whole cache directory.
media3-database = { module = "androidx.media3:media3-database", version.ref = "media3" }

# Ships in the *app*, not the test module: this is the half that reads the
# baked-in profile at install time and hands it to the runtime. Without it the
# profile travels in the APK and is never applied.
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
junit = { module = "junit:junit", version.ref = "junit" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
